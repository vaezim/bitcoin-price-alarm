<!doctype html>
<html>

<head>
    <title>Crypto price alarm</title>
    <style>
        .container {
            text-align: center;
        }

        .table-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }

        ul {
            text-align: left;
            margin-left: 45%;
            padding-left: 20px;
        }

        .submit-button {
            margin-top: 2%;
            width: 15%;
            height: 10%;
            font-size: medium;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Price limits</h1>
        <form method="post">
            Below: <input type="number" name="below"><br>
            Above: <input type="number" name="above"><br>
            <button type="submit" class="submit-button">Submit</button>
            <br><br>

            <div class="table-container">
                <!-- Above limits -->
                <table>
                    <thead>
                        <tr>
                            <th>Above Limits</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for limit in alarm.above_limits %}
                        <tr>
                            <td><input type="checkbox" name="remove_above" value="{{ limit }}"> {{ limit }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <!-- Below limits -->
                <table>
                    <thead>
                        <tr>
                            <th>Below Limits</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for limit in alarm.below_limits %}
                        <tr>
                            <td><input type="checkbox" name="remove_below" value="{{ limit }}"> {{ limit }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </form>
    </div>
</body>

</html>
